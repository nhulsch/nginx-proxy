name: Publish images to GHCR

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - update-nginx-1.31.9
    tags:
      - "*.*.*"
    paths-ignore:
      - "test/*"
      - ".gitignore"
      - "LICENSE"
      - "*.md"

# No third-party actions: only git and docker CLI commands are used.
jobs:
  build-push:
    name: Build and push ${{ matrix.flavor }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [alpine, debian, dockergen]
    env:
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - name: Checkout
        run: |
          git clone "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" .
          git checkout --detach "${GITHUB_SHA}"

      - name: Compute version, tags and labels
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="$(git describe --tags --always)"
          DOCKER_GEN_VERSION="$(sed -n -e 's;^FROM docker.io/nginxproxy/docker-gen:\([0-9.]*\).*;\1;p' "Dockerfile.${FLAVOR}")"

          case "$FLAVOR" in
            debian)    SUFFIX="";           BRANCH_TAG="latest" ;;
            alpine)    SUFFIX="-alpine";    BRANCH_TAG="alpine" ;;
            dockergen) SUFFIX="-dockergen"; BRANCH_TAG="dockergen" ;;
          esac

          TAGS="${IMAGE}:sha-${GITHUB_SHA::7}-${FLAVOR}"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "$GITHUB_REF_NAME" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            TAGS+=" ${IMAGE}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}${SUFFIX}"
            TAGS+=" ${IMAGE}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}${SUFFIX}"
          fi
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS+=" ${IMAGE}:${BRANCH_TAG}"
          fi

          {
            echo "IMAGE=${IMAGE}"
            echo "VERSION=${VERSION}"
            echo "DOCKER_GEN_VERSION=${DOCKER_GEN_VERSION}"
            echo "TAGS=${TAGS}"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU and Buildx
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --name builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the image
        run: |
          TAG_ARGS=()
          for t in $TAGS; do TAG_ARGS+=(-t "$t"); done
          docker buildx build \
            --file "Dockerfile.${FLAVOR}" \
            --platform linux/amd64,linux/arm64,linux/s390x,linux/arm/v7 \
            --build-arg "NGINX_PROXY_VERSION=${VERSION}" \
            --build-arg "DOCKER_GEN_VERSION=${DOCKER_GEN_VERSION}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --sbom=true \
            --provenance=mode=max \
            --cache-from "type=registry,ref=${IMAGE}:buildcache-${FLAVOR}" \
            --cache-to "type=registry,ref=${IMAGE}:buildcache-${FLAVOR},mode=max" \
            "${TAG_ARGS[@]}" \
            --push .
